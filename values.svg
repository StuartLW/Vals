<svg viewBox="-500 -350 1000 700"

	width="100%"
	height="100%"
	preserveAspectRatio="xMidYMid meet"

     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .center { fill:#245e78; }
	  .outer { fill:#3e7f23; }
	  text { font-family: Arial, sans-serif; fill:#fff; text-anchor: middle; dominant-baseline: middle; }
      .title { font-size: 30px; font-weight: 600; }
	  .outertitle { font-size: 22px; font-weight: 600; }
  .popup {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    fill: black;
    font-size: 14px;
  }

  a:focus .popup {
    opacity: 1;
  }
  
  .hex-group {
    cursor: pointer;
  }


    </style>

    <!-- Hexagon centred at (0,0) -->
    <g id="hex" transform="rotate(30)">
      <polygon points="
        0,-100
        86.6,-50
        86.6,50
        0,100
        -86.6,50
        -86.6,-50
      "/>
    </g>
  </defs>

  <!-- Exactly centred -->
 <g>
	<use href="#hex" class="center"/>
	<text x="0" y="0" class="title">
		<tspan x="0" dy="-0.6em">School of</tspan>
		<tspan x="0" dy="1.2em">Chemistry</tspan>
	</text>
 </g>
<a href="#">  
<g class= "hex-group" transform="translate(0,180) scale(0.8)"> 
	<use href="#hex" class="outer" />
	<text x="0" y="0" class="outertitle">
		<tspan x="0" dy="-1em">Sustainability</tspan>
		<tspan x="0" dy="1em">and</tspan>
		<tspan x="0" dy="1em">Stewardship</tspan>
	</text>
	
	<text class="popup" x="100" y="120">
